<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="macwipe: a quiet, simple scrubber for your Mac. Try the local web dashboard demo."
    />
    <title>macwipe</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles/theme.css" />
    <script src="scripts/ui.js" defer></script>
    <script src="scripts/landing.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <main
        id="main"
        class="window landing-window"
        aria-labelledby="brand-heading"
        tabindex="-1"
      >
        <header class="title-bar">
          <span class="title-bar-label">macwipe</span>
          <span class="window-control" aria-hidden="true">−</span>
        </header>
        <div class="landing-content">
          <img
            class="folder-icon"
            src="assets/macwipe-icon.png"
            width="48"
            height="48"
            alt=""
          />
          <h1 id="brand-heading">macwipe</h1>
          <p class="tagline">A quiet, simple scrubber for your Mac.</p>
          <a
            class="download-control primary-btn"
            href="downloads/macwipe-macos.zip"
            download="macwipe-macos.zip"
          >
            <img
              class="pixel-icon"
              src="assets/download.svg"
              width="18"
              height="18"
              alt=""
            />
            Download for macOS
          </a>
          <a class="demo-link primary-btn" href="dashboard.html">
            Launch Web Dashboard Demo
            <img
              class="pixel-icon"
              src="assets/arrow-right.svg"
              width="18"
              height="18"
              alt=""
            />
          </a>
          <div class="divider" aria-hidden="true"></div>
          <p class="questions-label">frequently asked</p>
          <div class="questions-list">
            <button
              class="question-row"
              type="button"
              data-question="data"
              aria-haspopup="dialog"
              aria-controls="question-chat"
              aria-expanded="false"
            >
              <span class="question-copy"
                ><img
                  class="pixel-icon"
                  src="assets/message.svg"
                  width="18"
                  height="18"
                  alt=""
                />
                <span>what happens with my data?</span></span
              >
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button
              class="question-row"
              type="button"
              data-question="local"
              aria-haspopup="dialog"
              aria-controls="question-chat"
              aria-expanded="false"
            >
              <span class="question-copy"
                ><img
                  class="pixel-icon"
                  src="assets/message.svg"
                  width="18"
                  height="18"
                  alt=""
                />
                <span>does it only scan my own Mac?</span></span
              >
              <span class="chevron" aria-hidden="true">›</span>
            </button>
            <button
              class="question-row"
              type="button"
              data-question="safe"
              aria-haspopup="dialog"
              aria-controls="question-chat"
              aria-expanded="false"
            >
              <span class="question-copy"
                ><img
                  class="pixel-icon"
                  src="assets/message.svg"
                  width="18"
                  height="18"
                  alt=""
                />
                <span>is it safe to delete these files?</span></span
              >
              <span class="chevron" aria-hidden="true">›</span>
            </button>
          </div>
        </div>
        <footer class="status-strip">
          macwipe v1.0 · 100% offline &amp; local
        </footer>
      </main>
    </div>
    <dialog
      class="window modal-dialog"
      data-chat-prefix="chat"
      id="question-chat"
      aria-labelledby="chat-title"
    >
      <header class="title-bar">
        <span class="title-bar-label" id="chat-title">mac-chat</span>
        <button
          class="window-control close-control"
          id="chat-close"
          type="button"
          data-close
          aria-label="Close question chat"
          autofocus
        >
          ×
        </button>
      </header>
      <div data-chat-content></div>
    </dialog>
  </body>
</html>
